services:
  # Nacos 注册中心
  nacos:
    image: nacos/nacos-server:2.2.3
    container_name: nacos
    restart: always
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    environment:
      - MODE=standalone
      - JVM_XMS=256m
      - JVM_XMX=256m
      - JVM_XMN=128m
    volumes:
      - ./nacos/data:/home/nacos/data
      - ./nacos/logs:/home/nacos/logs
    networks:
      - iot_network

  # Redis 内存服务
  redis:
    image: redis:3.2-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./redis/data:/data
    command: redis-server --appendonly yes
    networks:
      - iot_network

  # Sentinel 限流服务
  sentinel:
    image: bladex/sentinel-dashboard:1.8.6
    container_name: sentinel
    restart: always
    ports:
      - "8718:8080"
    environment:
      - JAVA_OPTS=-Dserver.port=8080 -Dcsp.sentinel.dashboard.server=localhost:8080 -Dproject.name=sentinel-dashboard -Xms128m -Xmx128m
    networks:
      - iot_network

  # RocketMQ 服务
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    container_name: rocketmq-namesrv
    restart: always
    ports:
      - "9876:9876"
    command: sh mqnamesrv
    volumes:
      - ./rocketmq/logs:/home/rocketmq/logs
      - ./rocketmq/store:/home/rocketmq/store
    networks:
      - iot_network

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    container_name: rocketmq-broker
    restart: always
    ports:
      - "10909:10909"
      - "10911:10911"
    command: sh mqbroker -n namesrv:9876
    volumes:
      - ./rocketmq/broker/conf/broker.conf:/opt/rocketmq/conf/broker.conf
      - ./rocketmq/logs:/home/rocketmq/logs
      - ./rocketmq/store:/home/rocketmq/store
    depends_on:
      - rocketmq-namesrv
    networks:
      - iot_network

  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:2.0.0
    container_name: rocketmq-dashboard
    restart: always
    ports:
      - "8792:8080"
    environment:
      - ROCKETMQ_NAMESRV_ADDR=namesrv:9876
    depends_on:
      - rocketmq-namesrv
      - rocketmq-broker
    networks:
      - iot_network

  # Elasticsearch
  elasticsearch:
    image: elasticsearch:8.17.4
    container_name: elasticsearch
    restart: always
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    volumes:
      - ./elasticsearch/data:/usr/share/elasticsearch/data
      - ./elasticsearch/config/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
    ulimits:
      memlock:
        soft: -1
        hard: -1
    networks:
      - iot_network

  # Seata 全局事务管理
  seata:
    image: seataio/seata-server:2.0.0
    container_name: seata
    restart: always
    ports:
      - "8091:8091"
    environment:
      - SEATA_CONFIG_NAME=file:/root/seata-config/registry
      - STORE_MODE=file
    volumes:
      - ./seata/config:/root/seata-config
    depends_on:
      - redis
    networks:
      - iot_network

networks:
  iot_network:
    driver: bridge
