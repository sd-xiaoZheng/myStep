# seata/config/file.conf
service {
  vgroupMapping.my_test_tx_group = "default"  # 事务组映射
  default.grouplist = "seata:8091"  # 默认分组地址
  enableDegrade = false
  disableGlobalTransaction = false
}

store {
  mode = "file"  # 存储模式（与 environment 一致）
  file {
    dir = "sessionStore"  # 会话存储目录
  }
  lock {
    mode = "file"
  }
  session {
    mode = "file"
  }
}
