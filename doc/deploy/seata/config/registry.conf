# seata/config/registry.conf
registry {
  type = "nacos"  # 使用 Nacos 作为注册中心，与你的服务发现一致

  nacos {
    application = "seata-server"
    serverAddr = "nacos:8848"  # Nacos 服务地址（与 docker-compose 中的服务名一致）
    group = "SEATA_GROUP"
    namespace = ""
    username = "nacos"
    password = "nacos"
    cluster = "default"
  }
}

config {
  type = "nacos"  # 使用 Nacos 作为配置中心

  nacos {
    serverAddr = "nacos:8848"  # Nacos 服务地址
    group = "SEATA_GROUP"
    namespace = ""
    username = "nacos"
    password = "nacos"
  }
}
